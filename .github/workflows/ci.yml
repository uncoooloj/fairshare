name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      # Adding a workspace requires adding it to one of the test lanes below.
      - name: Assert all workspaces are covered by test lanes
        run: |
          actual_workspaces="$(
            npm pkg get name --workspaces --json |
              node -p 'Object.keys(JSON.parse(require("node:fs").readFileSync(0, "utf8"))).join(",")'
          )"
          expected_workspaces="@fairshare/api,@fairshare/web,@fairshare/cloudflare-storage,@fairshare/contract-ai,@fairshare/domain,@fairshare/payments"
          if [ "$actual_workspaces" != "$expected_workspaces" ]; then
            echo "A workspace is missing from the CI test lanes."
            echo "Found: $actual_workspaces"
            exit 1
          fi
      - name: Run every test lane
        run: |
          set -uo pipefail
          (cd apps/api && node --import tsx --test --test-shard=1/2 test/*.test.ts) &
          shard_one=$!
          (cd apps/api && node --import tsx --test --test-shard=2/2 test/*.test.ts) &
          shard_two=$!
          (
            set -e
            npm run test --workspace @fairshare/web --if-present
            npm run test --workspace @fairshare/cloudflare-storage --if-present
            npm run test --workspace @fairshare/contract-ai --if-present
            npm run test --workspace @fairshare/domain --if-present
            npm run test --workspace @fairshare/payments --if-present
          ) &
          workspace_tests=$!
          status=0
          for pid in "$shard_one" "$shard_two" "$workspace_tests"; do
            wait "$pid" || status=1
          done
          exit "$status"

  quality_and_build:
    name: Quality and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      # Keep these serial: build and typecheck both compile the workspace graph.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  verify:
    if: ${{ always() }}
    needs: [tests, quality_and_build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        run: |
          test "${{ needs.tests.result }}" = success
          test "${{ needs.quality_and_build.result }}" = success
