name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm run format:check

  test_api_shard_1:
    name: API tests (shard 1/2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      # Preserve the API test command while splitting its test-file glob across runners.
      - run: cd apps/api && node --import tsx --test --test-shard=1/2 test/*.test.ts

  test_api_shard_2:
    name: API tests (shard 2/2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - run: cd apps/api && node --import tsx --test --test-shard=2/2 test/*.test.ts

  test_web_and_packages:
    name: Web and package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      # Adding a workspace requires adding it to one of the test lanes below.
      - name: Assert all workspaces are covered by test lanes
        run: |
          actual_workspaces="$(
            npm pkg get name --workspaces --json |
              node -p 'Object.keys(JSON.parse(require("node:fs").readFileSync(0, "utf8"))).join(",")'
          )"
          expected_workspaces="@fairshare/api,@fairshare/web,@fairshare/cloudflare-storage,@fairshare/contract-ai,@fairshare/domain,@fairshare/payments"
          if [ "$actual_workspaces" != "$expected_workspaces" ]; then
            echo "A workspace is missing from the CI test lanes."
            echo "Found: $actual_workspaces"
            exit 1
          fi
      - run: npm run test --workspace @fairshare/web --if-present
      - run: npm run test --workspace @fairshare/cloudflare-storage --if-present
      - run: npm run test --workspace @fairshare/contract-ai --if-present
      - run: npm run test --workspace @fairshare/domain --if-present
      - run: npm run test --workspace @fairshare/payments --if-present

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  verify:
    if: ${{ always() }}
    needs:
      [
        format,
        test_api_shard_1,
        test_api_shard_2,
        test_web_and_packages,
        typecheck,
        build,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        run: |
          test "${{ needs.format.result }}" = success
          test "${{ needs.test_api_shard_1.result }}" = success
          test "${{ needs.test_api_shard_2.result }}" = success
          test "${{ needs.test_web_and_packages.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.build.result }}" = success
