name: Deploy Fairshare

on:
  pull_request:
  workflow_dispatch:
    inputs:
      waive_persistence:
        description: "Explicitly waive hosted persistence checks for this sandbox release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fairshare-release-pr-{0}', github.event.pull_request.number) || 'fairshare-hosted-release' }}
  # PRs only validate Cloudflare-specific artifacts; replace stale runs for the same PR.
  # Main and manually dispatched releases remain serial and are never cancelled in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Check and release Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Test hosted release safeguards
        run: node --test deploy/cloudflare/*.test.mjs
      - name: Record persistence scope
        run: |
          scope=$(node deploy/cloudflare/persistence-gate.mjs --fingerprint)
          echo "Persistence scope SHA-256: $scope" >> "$GITHUB_STEP_SUMMARY"
      - name: Require current hosted persistence acceptance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.waive_persistence == true)
        env:
          FAIRSHARE_PERSISTENCE_ACCEPTANCE: ${{ vars.FAIRSHARE_PERSISTENCE_ACCEPTANCE }}
        run: node deploy/cloudflare/persistence-gate.mjs
      - name: Record explicit sandbox persistence waiver
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.waive_persistence == true
        run: |
          {
            echo "### Explicit sandbox persistence waiver"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Commit: $GITHUB_SHA"
            echo "- Target worker: fairshare-api-sandbox"
            echo "- Target API origin: https://fairshare-api-sandbox.udaleamehoj.workers.dev"
            echo "- Target web origin: https://usefairshare.app"
            echo "- Checks not performed: restart, redeploy, restore, rollback"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      # CI already runs format, the full test suite, types, and the regular build for
      # every PR. Keep those checks here for releases, where this workflow is the
      # deployment validation path, while PRs prove only Cloudflare-specific artifacts.
      - if: github.event_name != 'pull_request'
        run: npm run format:check
      - if: github.event_name != 'pull_request'
        run: npm test
      - if: github.event_name != 'pull_request'
        run: npm run typecheck
      - if: github.event_name != 'pull_request'
        run: npm run build
      - run: npm run check:cloudflare -w @fairshare/api
      - name: Record checked API bundle
        id: api_bundle
        run: echo "sha256=$(sha256sum apps/api/dist-cloudflare/worker.mjs | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: npm run cloudflare:build -w @fairshare/web
      - name: Skip superseded releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy API then web
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FAIRSHARE_PERSISTENCE_ACCEPTANCE: ${{ vars.FAIRSHARE_PERSISTENCE_ACCEPTANCE }}
          FAIRSHARE_PERSISTENCE_WAIVED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.waive_persistence == true }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          if [ "$FAIRSHARE_PERSISTENCE_WAIVED" = true ]; then
            echo 'Explicit sandbox persistence waiver active; hosted persistence checks were not performed.'
          else
            node deploy/cloudflare/persistence-gate.mjs
          fi
          actual=$(sha256sum apps/api/dist-cloudflare/worker.mjs | cut -d ' ' -f1)
          test "$actual" = "${{ steps.api_bundle.outputs.sha256 }}" || { echo 'Checked API bundle changed before deployment'; exit 1; }
          (cd apps/api && npx --no-install wrangler deploy --config wrangler.hosted.json --no-bundle --keep-vars)
          (cd apps/web && npx --no-install wrangler deploy --keep-vars)
      - name: Verify public release
        if: steps.current.outputs.deploy == 'true'
        run: node deploy/cloudflare/verify-live.mjs
      - name: Record release
        if: steps.current.outputs.deploy == 'true' && success()
        run: echo "Deployed commit $GITHUB_SHA to https://usefairshare.app while preserving existing PayPal capability settings. No provider or private-account acceptance was executed." >> "$GITHUB_STEP_SUMMARY"
