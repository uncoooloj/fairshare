name: Deploy Fairshare

on:
  workflow_dispatch:
    inputs:
      persistence_acceptance:
        description: Confirm restart, redeploy, restore, and rollback acceptance for the hosted sandbox.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fairshare-hosted-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      FAIRSHARE_API_URL: https://fairshare-api-sandbox.udaleamehoj.workers.dev
      FAIRSHARE_WEB_ORIGIN: https://usefairshare.app
      FAIRSHARE_API_PERSISTENCE_VERIFIED: ${{ inputs.persistence_acceptance && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Require explicit persistence acceptance
        run: node deploy/cloudflare/preflight.mjs
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:cloudflare -w @fairshare/api
      - run: node --test deploy/cloudflare/hosted.test.mjs
      - name: Record checked API bundle
        id: api_bundle
        run: echo "sha256=$(sha256sum apps/api/dist-cloudflare/worker.mjs | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: npm run cloudflare:build -w @fairshare/web
      - name: Skip superseded releases
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy API then web
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          actual=$(sha256sum apps/api/dist-cloudflare/worker.mjs | cut -d ' ' -f1)
          test "$actual" = "${{ steps.api_bundle.outputs.sha256 }}" || { echo 'Checked API bundle changed before deployment'; exit 1; }
          (cd apps/api && npx --no-install wrangler deploy --config wrangler.hosted.json --no-bundle)
          (cd apps/web && npx --no-install wrangler deploy --keep-vars)
      - name: Verify public release
        if: steps.current.outputs.deploy == 'true'
        run: node deploy/cloudflare/verify-live.mjs
      - name: Record release
        if: steps.current.outputs.deploy == 'true' && success()
        run: echo "Deployed commit $GITHUB_SHA to https://usefairshare.app with optional money features disabled. No provider or private-account acceptance was executed." >> "$GITHUB_STEP_SUMMARY"
